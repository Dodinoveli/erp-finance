  <script type="module" th:inline="javascript">
    const supplierModel = {


      init: function () {
        // setTimeout(() => {
        //   document.getElementById("search-supplier-input")?.focus();
        // }, 100);
        const wrapperId = document.getElementById("supplier-wrapper");
        // const keyword = document.getElementById("search-supplier-input").value;
        // this.loadMore("", true);
        // this.initDropdownListener();
        // this.bindEvents();
        // this.initScroll(wrapperId, keyword); // 🔥 pasang di sini
        // this.switchTabSupplier("view-list-supplier");
        // this.bersih();
        // this.generateCode();
        this.loadBaganAkun()
      },

      loadBaganAkun: async function () {
        try {

          const response = await api.get(`/api/v1/coa/tree`);
          let dataFormatPohon;
          if (response.status === "success") {
            dataFormatPohon = response.data;
          }
          //const result = await response.json();
          // Ini adalah List<CoaResponse> kamu

          // 3. Inisialisasi Tabulator (Sangat Mudah!)
          var table = new Tabulator("#tabel-coa", {
            data: dataFormatPohon,
            dataTree: true,               // AKTIFKAN FITUR POHON (Buka-Tutup)
            dataTreeChildField: "children", // Beritahu Tabulator kalau anaknya bernama "children"
            dataTreeStartExpanded: false,  // Awal dibuka, set false supaya rapi (tertutup dulu)
            layout: "fitColumns",         // Lebar kolom otomatis pas dengan layar

            // Atur Kolom Tabelnya di sini
            columns: [
              { title: "Kode", field: "coaCode", width: 120, headerSort: false },
              {
                title: "Akun", field: "name", responsive: 0, headerSort: false, formatter: function (cell) {
                  // Trik agar akun Header otomatis tercetak Tebal (Bold) seperti di Balaka
                  const rowData = cell.getRow().getData();
                  if (rowData.isHeader || rowData.header) {
                    return `<strong>${cell.getValue()}</strong> <span class="badge bg-primary-subtle text-primary ms-1" style="font-size: 10px;">Header</span>`;
                  }
                  return cell.getValue();
                }
              },
              {
                title: "Kategori",
                field: "accountCategory",
                width: 120, headerSort: false,
                formatter: function (cell) {
                  const tipe = cell.getValue();
                  let badgeClass = "bg-secondary-subtle text-secondary";

                  if (tipe === "ASSET" || tipe === "Aset") {
                    badgeClass = "bg-primary-subtle text-primary"; // Biru
                  } else if (tipe === "LIABILITY") {
                    badgeClass = "bg-danger-subtle text-danger"; // Merah
                  } else if (tipe === "EQUITY") {
                    badgeClass = "bg-warning-subtle text-warning"; // Kuning/Oranye
                  } else if (tipe === "INCOME") {
                    badgeClass = "bg-success-subtle text-success"; // Hijau
                  } else if (tipe === "EXPENSE") {
                    badgeClass = "bg-info-subtle text-info"; // Biru Muda / Toska
                  }

                  // Kembalikan tag HTML dengan class warna yang sudah dinamis
                  return `<span class="badge ${badgeClass}">${tipe}</span>`;

                  // Bungkus tipe akun pakai badge biar berwarna
                  //return `<span class="badge bg-secondary-subtle text-secondary">${cell.getValue()}</span>`;
                }
              },
              { title: "Saldo Normal", field: "normalBalance", width: 180, headerSort: false }
            ]
          });

        } catch (error) {
          console.error("Gagal memuat data:", error);
        }
      }

    };


    // window.supplierModel = supplierModel;
    window.supplierModel = supplierModel;
    supplierModel.init();
  </script>
