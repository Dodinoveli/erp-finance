  <script type="module" th:inline="javascript">
    const bankAcconts = {
      cursorCreatedAt: null,
      cursorId: null,
      hasNext: true,
      loading: false,
      limit: 15,
      resizableInit: false,
      allData: [],

      init: function () {
        const wrapperId = document.getElementById("bankaccounts-wrapper");
        const keyword = document.getElementById(
          "search-bankaccounts-input",
        ).value;
        this.loadMore(true);
        this.initDropdownListener();
        this.bindEvents();
        this.initScroll(wrapperId, keyword);
        this.switchTabBankAccounts("view-list-bankaccounts");
        // this.bersih();
        this.loadCoa();
      },

      initScroll: function (wrapper, keyword) {
        // const wrapper = document.querySelector(wrapperId);
        let lastScrollTop = 0; // Untuk mendeteksi arah scroll

        wrapper.addEventListener("scroll", () => {
          const scrollTop = wrapper.scrollTop;
          const isScrollingDown = scrollTop > lastScrollTop; // Cek arah bawah
          lastScrollTop = scrollTop;

          const nearBottom =
            scrollTop + wrapper.clientHeight >= wrapper.scrollHeight - 50;

          // ✅ SYARAT: Harus scroll ke bawah, sedang tidak loading, dan masih ada data selanjutnya
          if (isScrollingDown && nearBottom && !this.loading && this.hasNext) {
            console.log("Memuat data selanjutnya...");

            this.loadMore(keyword);
          }
        });
      },

      bersih: function () {
        // const form = document.getElementById("formClient");
        // const target = document.getElementById("client_code");
        // const val = target.value;
        // form.reset();
        // target.value = val;
      },

      bindEvents: function () {
        const self = this;

        // 1. Ambil semua elemen
        const searchInput = document.getElementById(
          "search-bankaccounts-input",
        );
        const btnTambah = document.getElementById("btn-tambah-bankaccounts");
        const btnSearch = document.getElementById("btn-search-bankaccounts");
        const btnRefresh = document.getElementById("btn-refresh-bankaccounts");
        const btnBatal = document.getElementById("btn-batal-bankaccounts");
        const form = document.getElementById("formBankAccount");
        const accountType = document.getElementById("account_type");
        const bankName = document.getElementById("bank_name");
        const bankBranch = document.getElementById("bank_branch");
        const accountNumber = document.getElementById("account_number");
        const accountHolder = document.getElementById("account_holder");

        // 2. Gunakan Optional Chaining atau IF check agar script tidak mati jika ada elemen yang null
        if (btnSearch && searchInput) {
          btnSearch.onclick = () => {
            const keyword = searchInput.value.trim();
            if (!keyword) {
              showToast("error", "Input pencarian masih kosong");
              return;
            }
            this.loadMore(keyword, true);
            // alert("cokk")
          };
        }

        if (btnRefresh && searchInput) {
          btnRefresh.onclick = () => {
            searchInput.value = "";
            this.loadMore(true);
          };
        }

        if (btnTambah) {
          btnTambah.onclick = () => {
            this.switchTabBankAccounts("view-input-bankaccounts");
          };
        }

        if (searchInput) {
          searchInput.onkeyup = (e) => {
            if (e.key === "Enter") {
              this.loadMore(searchInput.value.trim(), 0);
            }
          };
        }

        if (btnBatal) {
          btnBatal.onclick = () => {
            form.reset();
            // this.generateCode();
            this.switchTabBankAccounts("list");
            // document.getElementById("btn-hapus").style.display = "none";
            const label = document.getElementById("text-label-bankaccounts");
            if (label) label.textContent = "Data Baru";
          };
        }

        if (accountType) {
          accountType.addEventListener("change", function () {
            // const idx = e.target.options[this.selectedIndex].value;
            // console.log("index akun tipe", this.value)
            let val = this.value;
            if (val === "CASH") {
              // alert(val) #d9d1d1
              bankName.readOnly = true;
              bankName.style.background = "#d9d1d1";

              bankBranch.readOnly = true;
              bankBranch.style.background = "#d9d1d1";

              accountNumber.readOnly = true;
              accountNumber.style.background = "#d9d1d1";

              accountHolder.readOnly = true;
              accountHolder.style.background = "#d9d1d1";

              // kosongkan field
              document.getElementById("bank_name").value = "";
              document.getElementById("bank_branch").value = "";
              document.getElementById("account_number").value = "";
              document.getElementById("account_holder").value = "";
            } else {
              bankName.readOnly = false;
              bankName.style.background = "#ffff";

              bankBranch.readOnly = false;
              bankBranch.style.background = "#ffff";

              accountNumber.readOnly = false;
              accountNumber.style.background = "#ffff";

              accountHolder.readOnly = false;
              accountHolder.style.background = "#ffff";
            }

            self.showCoa(val);
          });
        }

        // 3. Pasang Listener Form (Pastikan ini dijalankan)
        if (form) {
          console.log("Form BankAccount ditemukan, memasang event listener...");
          form.addEventListener("submit", function (e) {
            e.preventDefault();
            console.log("Submit terdeteksi!");
            //alert("yess");
            self.createBankAccounts(this);
          });
        } else {
          console.warn(
            "Elemen #formBankAccount tidak ditemukan di DOM saat init!",
          );
        }

        const tbody = document.getElementById("bankaccounts-table-body");
        tbody.addEventListener("dblclick", (e) => {
          const tr = e.target.closest("tr.clickable-row");
          if (!tr) return;

          const index = tr.dataset.index;
          const row = this.allData[index];

          // this.switchTabBankAccounts('view-input-bankaccounts', row);
          // document.getElementById('text-label-bankaccounts').textContent = 'Perbaharui Data';
          document.getElementById("account_code").readOnly = true;
          if (row) {
            this.switchTabBankAccounts("view-input-bankaccounts", row);
            document.getElementById("text-label-bankaccounts").textContent =
              "Perbaharui Data";

            let val = row.accountType;
            if (val === "CASH") {
              // alert(val) #d9d1d1
              bankName.readOnly = true;
              bankName.style.background = "#d9d1d1";

              bankBranch.readOnly = true;
              bankBranch.style.background = "#d9d1d1";

              accountNumber.readOnly = true;
              accountNumber.style.background = "#d9d1d1";

              accountHolder.readOnly = true;
              accountHolder.style.background = "#d9d1d1";

              // kosongkan field
              document.getElementById("bank_name").value = "";
              document.getElementById("bank_branch").value = "";
              document.getElementById("account_number").value = "";
              document.getElementById("account_holder").value = "";
            } else {
              bankName.readOnly = false;
              bankName.style.background = "#ffff";

              bankBranch.readOnly = false;
              bankBranch.style.background = "#ffff";

              accountNumber.readOnly = false;
              accountNumber.style.background = "#ffff";

              accountHolder.readOnly = false;
              accountHolder.style.background = "#ffff";
            }
          }
        });

        // let isaktif;
        // const aktif = document.getElementById("is_active");
        // aktif.addEventListener("change", function () {
        //     isaktif = this.checked;
        //     return alert(isaktif);
        // })
      },

      showCoa: async function (keyword) {
        try {
          const params = new URLSearchParams({
            keyword: keyword,
          });
          const json = await api.get(
            `/api/v1/bankaccounts/search?keyword=${keyword.toString()}`,
          );
          if (json.status === "success" && json.code === 200) {
            console.log("Hasillllllll = ", json.data);

            if (json.data.length > 0) {
              document.getElementById("coa_id").value = json.data[0].coaId;
              document.getElementById("coa_name").value = json.data[0].name;
            } else {
              // alert("")
              document.getElementById("coa_id").value = "";
              document.getElementById("coa_name").value = "";
            }
          }
        } catch (error) { }
      },

      loadMore: async function (reset = false) {
        if (this.loading) return;
        if (!reset) return;
        const tbody = document.getElementById("bankaccounts-table-body");
        const statusMsg = "";

        if (reset) {
          // this.cursorCreatedAt = null;
          // this.cursorId = null;
          // this.hasNext = true;
          tbody.innerHTML = "";
        }

        this.loading = true;
        UI.showSkeleton("bankaccounts-table-body", 11);

        try {
          // const params = new URLSearchParams({
          //     keyword: keyword,
          //     limit: this.limit,
          // });

          // if (this.cursorCreatedAt && this.cursorId) {
          //     params.append("lastCreatedAt", this.cursorCreatedAt);
          //     params.append("lastId", this.cursorId);
          // }

          const [json] = await Promise.all([
            api.get(`/api/v1/bankaccounts`),
            new Promise((resolve) => setTimeout(resolve, 1000)),
          ]);

          if (json && json.status === "success") {
            const res = json.data;
            UI.hideSkeleton();

            console.log(" data pada load more ========= ", res);
            // 🔥 GABUNGKAN DATA: Jika reset, buat baru. Jika scroll, tambah ke belakang.
            if (reset) {
              this.allData = res;
            } else {
              this.allData = [...this.allData, ...res];
            }

            // Kirim 'this.allData.length' untuk tahu posisi index awal batch ini
            const startIndex = reset ? 0 : this.allData.length - res.length;
            this.renderTable(res, reset, startIndex);

            // 🔥 update cursor
            // this.cursorCreatedAt = res.nextCreatedAt;
            // this.cursorId = res.nextId;
            // this.hasNext = res.hasNext;

            // console.log(" cursorId =", this.cursorId);
            // console.log(" hasNext =", this.hasNext);
          }
          document.getElementsByClassName(
            "table-wrapper-client",
          )[0].style.height = "80svh";
          // Mengatur tinggi tabel sebesar 60% dari tinggi layar monitor
          // document.getElementsByClassName('table-wrapper')[0].style.height = "90vh";
        } catch (err) {
          tbody.innerHTML = `<tr><td colspan="13" class="text-center text-danger">Error: ${err.message}</td></tr>`;
          UI.hideSkeleton();
        } finally {
          this.loading = false;
          UI.hideSkeleton();
        }
      },

      renderTable: function (data, isReset = false, startIndex = 0) {
        const tbody = document.getElementById("bankaccounts-table-body");

        console.log(" total data ========= ", data);
        if (!data || data.length === 0) {
          if (isReset) {
            tbody.innerHTML =
              '<tr><td colspan="13" class="text-center py-3">No data available</td></tr>';
          }
          return;
        }

        if (isReset) {
          tbody.innerHTML = "";
        }

        let rowsHtml = "";
        data.forEach((row, i) => {
          const globalIndex = startIndex + i;
          rowsHtml += `
                    <tr class="clickable-row" data-index="${globalIndex}" id="row-bankaccounts-${row.bankAccountId}">
                        <td class="kolom-sticky-1 text-center">${row.accountCode}</td>
                        <td class="kolom-sticky-2 cell-wrap">${row.accountName}</td>
                        <td class="kolom-sticky-3 cell-wrap">${row.accountType || "-"}</td>
                        <td>${row.bankName || "-"}</td>
                        <td>${row.bankBranch || "-"}</td>
                        <td>${row.accountNumber || "-"}</td>
                        <td>${row.accountHolder || "-"}</td>
                        <td>${row.isActive}</td>
                   </tr>`;
        });

        tbody.insertAdjacentHTML("beforeend", rowsHtml);

        if (!this.resizableInit) {
          this.makeColumnsResizable();
          this.resizableInit = true;
        }
      },

      makeColumnsResizable: function () {
        const table = document.getElementById("client-table");
        const cols = table.querySelectorAll("th.resizer");

        cols.forEach((th) => {
          let startX, startWidth;

          th.addEventListener("mousedown", (e) => {
            startX = e.pageX;
            startWidth = th.offsetWidth;

            const onMouseMove = (e) => {
              const newWidth = startWidth + (e.pageX - startX);
              th.style.width = newWidth + "px";
            };

            const onMouseUp = () => {
              document.removeEventListener("mousemove", onMouseMove);
              document.removeEventListener("mouseup", onMouseUp);
            };

            document.addEventListener("mousemove", onMouseMove);
            document.addEventListener("mouseup", onMouseUp);
          });
        });
      },

      switchTabBankAccounts: function (type, row) {
        // Element Konten
        //view-input-bankaccounts
        const viewInput = document.getElementById("view-input-bankaccounts");
        const viewList = document.getElementById("view-list-bankaccounts");

        // Element Tombol
        const btnInput = document.getElementById("btn-tab-input-bankaccounts");
        const btnList = document.getElementById("btn-tab-list-bankaccounts");

        if (type === "view-input-bankaccounts") {
          viewInput.style.display = "block";
          viewList.style.display = "none";

          btnInput.classList.add("active");
          btnInput.classList.remove("text-light");

          btnList.classList.remove("active");
          btnList.classList.add("text-light");

          this.rowData(row);
        } else {
          viewInput.style.display = "none";
          viewList.style.display = "block";

          btnInput.classList.remove("active");
          btnInput.classList.add("text-light");

          btnList.classList.add("active");
          btnList.classList.remove("text-light");
          this.bersih();
          // this.loadMore('', true);
        }
      },

      closeEdit: function (e) {
        // e.stopPropagation(); // Biar gak trigger click tabnya
        // document.getElementById("li-tab-detail-client").style.display = "none";
        // this.switchTabBankAccounts("view-list-bankaccounts", "");
      },

      rowData: function (row) {
        if (!row) {
          console.warn("Data row tidak ditemukan atau undefined");
          return;
        }

        // Mapping antara ID element HTML dan property dari data 'row'
        const fields = {
          bank_account_id: row.bankAccountId,
          account_code: row.accountCode,
          account_name: row.accountName,
          account_type: row.accountType,
          bank_branch: row.bankBranch,
          bank_name: row.bankName,
          account_number: row.accountNumber,
          account_holder: row.accountHolder,
          currency: row.currency,
          // is_active: row.isActive,
          opeing_balence: row.openingBalance,
          coa_id: row.coaId,
          coa_name: row.name,
        };

        // Isi secara otomatis dengan pengecekan safety
        Object.keys(fields).forEach((id) => {
          const el = document.getElementById(id);
          if (el) {
            // Paksa ke String agar select option bisa mencocokkan value
            // Gunakan ?? (Nullish Coalescing) bukan || (OR)
            const valueFields = fields[id] ?? "";
            el.value = String(valueFields);
          }
        });

        // Tampilkan tombol hapus
        // const btnHapus = document.getElementById("btn-hapus");
        // if (btnHapus) {
        //     btnHapus.style.display = "block";
        // }
      },

      toggleExcelMenu: function (e) {
        if (e) e.stopPropagation(); // Kunci utama agar menu tidak langsung tertutup saat tombol diklik
        const menu = document.getElementById("menu-excel-client");
        if (menu) {
          const isHidden =
            menu.style.display === "none" || menu.style.display === "";
          menu.style.display = isHidden ? "block" : "none";
        }
      },

      // Fungsi tambahan: Tutup menu kalau user klik di luar menu
      initDropdownListener: function () {
        window.addEventListener("click", function () {
          const menu = document.getElementById("menu-excel-client");
          if (menu) {
            menu.style.display = "none";
          }
        });
      },

      createBankAccounts: async function (formEl) {
        const searchInput = document.getElementById(
          "search-bankaccounts-input",
        );
        const formData = new FormData(formEl);
        const id = formData.get("bankAccountId");
        // 🔥 kalau backend butuh JSON
        const payload = Object.fromEntries(formData.entries());

        const msg = id ? "Mengubah Data..." : "Menyimpan Data...";
        UI.showSkeleton("bankaccounts-table-body", 10);
        this.showErrors({}, formEl);
        try {
          const result = id
            ? await api.put(`/api/v1/bankaccounts/${id}`, payload, msg)
            : await api.post(`/api/v1/bankaccounts`, payload, msg);

          if (id) {
            // Ambil data terbaru hasil return dari Backend (biasanya result.data berisi object yang baru diupdate)
            const updatedRow = result.data;

            // Update Array local agar saat di-klik lagi datanya sudah yang baru
            const index = this.allData.findIndex(
              (item) => item.bankAccountId === id,
            );
            if (index !== -1) {
              this.allData[index] = updatedRow;

              // Update Baris Tabel secara langsung tanpa refresh
              this.updateRowUI(id, updatedRow);
            }
            document.getElementById("text-label-bankaccounts").textContent =
              "Data Baru";
          } else {
            this.loadMore("", true);
          }

          Swal.fire({
            title: "Sukses!",
            text: result.message,
            icon: "success",
          });

          const bankAccountId = document.getElementById("bank_account_id");
          if (bankAccountId) {
            bankAccountId.value = "";
          }

          formEl.reset();
          // this.generateCode();
          this.switchTabBankAccounts("view-list-bankaccounts", "");
          // document.getElementById("btn-hapus").style.display = "none";
        } catch (err) {
          console.log("Full Error Object = ", err);
          const errors = err?.errors || err?.data?.errors;
          if (errors) {
            this.showErrors(errors, formEl);
          } else {
            Swal.fire({
              icon: "error",
              title: "Oops...",
              text: err.message,
            });
          }
          UI.hideSkeleton();
        } finally {
          UI.hideSkeleton();
        }
      },

      updateRowUI: function (id, data) {
        const tr = document.getElementById(`row-bankaccounts-${id}`);
        if (!tr) return;

        // Update kolom-kolomnya (sesuaikan urutan <td> kamu)
        const cells = tr.cells;
        cells[0].textContent = data.accountCode;
        cells[1].textContent = data.accountName;
        cells[2].textContent = data.accountType || "-";
        cells[3].textContent = data.bankName || "-";
        cells[4].textContent = data.bankBranch || "-";
        cells[5].textContent = data.accountNumber || "-";
        cells[6].textContent = data.accountHolder || "-";
        cells[7].textContent = data.isActive;
        // updatedAt dsb...

        // 2. 🔥 SOLUSI HIGHLIGHT: Targetkan semua TD di dalam baris ini
        const allCells = tr.querySelectorAll("td");

        allCells.forEach((td) => {
          td.style.transition = "background-color 1s ease"; // Animasi halus
          td.style.backgroundColor = "#e8f5e9"; // Kuning highlight
        });

        // 3. Kembalikan ke warna semula setelah 1.5 detik
        setTimeout(() => {
          allCells.forEach((td) => {
            td.style.backgroundColor = ""; // Reset (kembali ke CSS asli)
          });
        }, 1500);
      },

      delete: function () {
        const id = document.getElementById("client_id").value;
        if (!id) {
          showToast("warning", "Pilih data yang akan dihapus terlebih dahulu");
          return;
        }

        Swal.fire({
          title: "Konfirmasi Hapus",
          text: "Apakah Anda yakin ingin menghapus data ini? setuju atau batalkan.",
          icon: "warning",
          showCancelButton: true,
          confirmButtonColor: "#0092DC", // Biru EasyUI
          cancelButtonColor: "#e57373",
          confirmButtonText: "Ya, Hapus!",
          cancelButtonText: "Batal",
          // Agar kotak seperti EasyUI
          customClass: {
            popup: "border-easyui-blue",
            cancelButton: "btn-swal-cancel",
          },
        }).then((result) => {
          if (result.isConfirmed) {
            // Panggil fungsi delete data milikmu
            this.deleteData(id);
            // showLoading("Proses penghapusan dijalankan...");
          } else {
            console.log("Penghapusan dibatalkan.");
          }
        });
      },

      deleteData: async function (id) {
        const payload = {
          status: "0",
        };

        try {
          const rst = await api.put(
            `/api/v1/clients/updatestatus/${id}`,
            payload,
            "Menghapus data...",
          );

          showToast("success", rst.message);
          const clientIdEl = document.getElementById("client_id");
          if (clientIdEl) {
            clientIdEl.value = "";
          }
          const form = document.getElementById("formClient");
          form.reset();
          this.generateCode();
          this.switchTabBankAccounts("view-list-bankaccounts", "");
          this.loadMore("", true);

          const btn = document.getElementById("btn-hapus");
          if (btn) btn.style.display = "none";
        } catch (error) {
          showToast("error", error.message);
        }
      },

      showErrors: function (errors, formEl) {
        if (!formEl) return; // 🔥 guard biar gak error lagi

        // 🔥 reset hanya di form ini
        formEl
          .querySelectorAll(".is-invalid")
          .forEach((i) => i.classList.remove("is-invalid"));

        formEl
          .querySelectorAll('[id^="err-"]')
          .forEach((e) => (e.innerText = ""));

        // 🔥 set error
        for (const field in errors) {
          const input = formEl.querySelector(`[name = "${field}"]`);
          const errorEl = formEl.querySelector("#err-" + field);

          if (input) input.classList.add("is-invalid");
          if (errorEl) errorEl.innerText = errors[field];
        }
      },
    };

    window.bankAcconts = bankAcconts;
    bankAcconts.init();
  </script>
