<!doctype html>
<html lang="id" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/main}">

<body>
  <div layout:fragment="content" th:fragment="content">
    <main class="main">
      <div class="container-fluid mt-2">
        <form id="formSupplier">
          <div class="card cardx p-1">
            <div class="card-body">
              <div class="row g-3">
                <div class="col-md-6">
                  <div class="mb-3">
                    <label class="lbl-normal">Nama*</label>
                    <div class="form-field">
                      <input type="text" d="supplier_name" name="supplierName" class="form-control input-underline"
                        placeholder="PT ABC, Toko Bintang " />
                      <small class="text-danger" id="err-supplierName"></small>
                    </div>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="mb-3">
                    <label class="lbl-normal">Npwp</label>
                    <div class="form-field">
                      <input type="text" id="supplier_npwp" name="supplierNpwp" class="form-control input-underline"
                        placeholder="Nomor Pokok Wajib Pajak" />
                      <small class="text-danger" id="err-supplierNpwp"></small>
                    </div>
                  </div>
                </div>
              </div>
              <div class="row g-3">
                <div class="col-md-6">
                  <div class="mb-3">
                    <label class="lbl-normal">Pkp <span class="text-danger">*</span></label>
                    <div class="form-field">
                      <select id="supplier_pkp" name="supplierPkp" class="form-select select-underline">
                        <option disabled selected>-- Pilih Status PKP --</option>
                        <option value="true">Ya</option>
                        <option value="false">Tidak</option>
                      </select>
                      <small class="text-danger" id="err-supplierPkp"></small>
                    </div>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="mb-3">
                    <label class="lbl-normal">Tipe*</label>
                    <div class="form-field">
                      <select id="supplier_type" name="supplierType" class="form-select select-underline"
                        aria-label="Default select example">
                        <option value="" disabled selected>
                          -- Pilih Tipe --
                        </option>
                        <option value="Material">Material</option>
                        <option value="Service">Service</option>
                        <option value="Equipment">Equipment</option>
                        <option value="Subcontractor">Subcontractor</option>
                      </select>
                      <small class="text-danger" id="err-supplierType"></small>
                    </div>
                  </div>
                </div>
              </div>
              <div class="row g-3">
                <div class="col-md-12">
                  <div class="mb-3">
                    <label style="padding-top: 5px" class="lbl-normal">Alamat</label>
                    <div class="form-field">
                      <textarea id="supplier_address" name="supplierAddress" class="form-control input-underline"
                        rows="1"
                        placeholder="Jl. ZA. Pagar Alam, Gedong Meneng, Kec. Rajabasa, Kota Bandar Lampung, Lampung 35141"></textarea>
                      <small class="text-danger" id="err-supplierAddress"></small>
                    </div>
                  </div>
                </div>
              </div>
              <div class="row g-3">
                <div class="col-md-6">
                  <div class="mb-3">
                    <label class="lbl-normal">Kota</label>
                    <div class="form-field">
                      <input type="text" id="supplier_city" name="supplierCity" class="form-control input-underline"
                        placeholder="Bandar Lampung" />
                      <small class="text-danger" id="err-supplierCity"></small>
                    </div>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="mb-3">
                    <label class="lbl-normal">Provinsi</label>
                    <div class="form-field">
                      <input type="text" id="supplier_province" name="supplierProvince"
                        class="form-control input-underline" placeholder="Lampung" />
                      <small class="text-danger" id="err-supplierProvince"></small>
                    </div>
                  </div>
                </div>
              </div>

              <div class="row g-3">
                <div class="col-md-6">
                  <div class="mb-3">
                    <label class="lbl-normal">Kode Pos</label>
                    <div class="form-field">
                      <input type="text" id="supplier_postal_code" name="supplierPostalCode"
                        class="form-control input-underline" placeholder="12345" />
                      <small class="text-danger" id="err-clientPostalCode"></small>
                    </div>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="mb-3">
                    <label class="lbl-normal">Negara</label>
                    <div class="form-field">
                      <input type="text" id="supplier_country" name="supplierCountry"
                        class="form-control input-underline" placeholder="Indonesia" value="Indonesia" />
                      <small class="text-danger" id="err-supplierCountry"></small>
                    </div>
                  </div>
                </div>
              </div>

              <div class="row g-3">
                <div class="col-md-6">
                  <div class="mb-3">
                    <label class="lbl-normal">Nama Kontak</label>
                    <div class="form-field">
                      <input type="text" id="supplier_contact_person" name="supplierContactPerson"
                        class="form-control input-underline" placeholder="Syahrini" />
                      <small class="text-danger" id="err-supplierContactPerson"></small>
                    </div>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="mb-3">
                    <label class="lbl-normal">Handphone</label>
                    <div class="form-field">
                      <input type="text" id="supplier_contact_phone" name="supplierContactPhone"
                        class="form-control input-underline" placeholder="085269530000" />
                      <small class="text-danger" id="err-supplierContactPhone"></small>
                    </div>
                  </div>
                </div>
              </div>

              <div class="row g-3">
                <div class="col-md-6">
                  <div class="mb-3">
                    <label class="lbl-normal">Email</label>
                    <div class="form-field">
                      <input type="email" id="supplier_email" name="supplierEmail" class="form-control input-underline"
                        placeholder="jayamajubersama@gmail.com" />
                      <small class="text-danger" id="err-supplierEmail"></small>
                    </div>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="mb-3">
                    <label class="lbl-normal">Nama Bank</label>
                    <div class="form-field">
                      <input type="text" id="supplier_bank_name" name="supplierBankName"
                        class="form-control input-underline" placeholder="BNI" />
                      <small class="text-danger" id="err-supplierBankName"></small>
                    </div>
                  </div>
                </div>
              </div>

              <div class="row g-3">
                <div class="col-md-6">
                  <div class="mb-3">
                    <label class="lbl-normal">No. Rekening</label>
                    <div class="form-field">
                      <input type="text" id="supplier_bank_account_number" name="supplierBankAccountNumber"
                        class="form-control input-underline" placeholder="0123456789" />
                      <small class="text-danger" id="err-supplierBankAccountNumber"></small>
                    </div>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="mb-3">
                    <label class="lbl-normal">Pemilik</label>
                    <div class="form-field">
                      <input type="text" id="supplier_bank_account_name" name="supplierBankAccountName"
                        class="form-control input-underline" placeholder="Contoh : PT Jaya Maju Bersama" />
                      <small class="text-danger" id="err-supplierBankAccountName"></small>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="detail-actions">
            <button type="submit" class="btn btn-simpan">
              <i class="bi bi-floppy"></i> Simpan
            </button>
            <a th:href="@{/supplier}" class="btn btn-batal" style="white-space: nowrap" hx-get="/supplier"
              hx-target="#page-content" hx-push-url="true" hx-indicator="#loading"><i class="bi bi-x-lg"></i> Batal
            </a>
          </div>
        </form>
      </div>
    </main>
    <script type="module" th:inline="javascript">
      var supplierNew = {
        init: function () {
          this.bindEvents();
        },

        bindEvents: function () {
          const self = this;
          const form = document.getElementById("formSupplier");
          if (form.dataset.bound === "true") return;
          form.dataset.bound = "true";
          console.log("Form Client supplier, memasang event listener...");
          form.addEventListener("submit", function (e) {
            e.preventDefault();
            console.log("Submit terdeteksi!");
            self.createSupplier(form);
          });
        },

        createSupplier: async function (formEl) {
          const formData = new FormData(formEl);
          const payload = Object.fromEntries(formData.entries());
          this.showErrors({}, formEl);
          Toast.loading("Menyimpan data...");

          try {
            const url = `/api/v1/suppliers`;
            var response = await fetch(url, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              credentials: "include",
              body: JSON.stringify(payload),
            });

            const result = await response.json();
            if (!response.ok) {
              throw {
                status: response.status,
                message: result?.message || "Gagal menyimpan data",
                errors: result?.errors,
                data: result,
              };
            }

            await Toast.success(result.message, "Berhasil!", 2000);
            setTimeout(() => {
              var url = "/supplier";
              htmx
                .ajax("GET", url, {
                  target: "#page-content",
                  swap: "innerHTML",
                  indicator: "#loading",
                })
                .then(() => {
                  window.history.pushState({}, "", url);
                });
            }, 1500);

            return result;
          } catch (err) {
            console.log("Full Error Object = ", err);
            const errors = err?.errors || err?.data?.errors;
            if (errors) {
              this.showErrors(errors, formEl);
              Toast.error(err.message, "Error", 3000);
            } else {
              Toast.error(err.message, "Opps Error", 3000);
            }
            throw err;
          }
        },

        showErrors: function (errors, formEl) {
          if (!formEl) return; // 🔥 guard biar gak error lagi

          // 🔥 reset hanya di form ini
          formEl
            .querySelectorAll(".is-invalid")
            .forEach((i) => i.classList.remove("is-invalid"));

          formEl
            .querySelectorAll('[id^="err-"]')
            .forEach((e) => (e.innerText = ""));

          // 🔥 set error
          for (const field in errors) {
            const input = formEl.querySelector(`[name = "${field}"]`);
            const errorEl = formEl.querySelector("#err-" + field);

            if (input) input.classList.add("is-invalid");
            if (errorEl) errorEl.innerText = errors[field];
          }
        },
      };

      window.supplierNew = supplierNew;
      supplierNew.init();
    </script>
  </div>
</body>

</html>
