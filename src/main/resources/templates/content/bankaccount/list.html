<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layouts/main}">
<style>
    /* Menyembunyikan kotak pencarian DataTables tapi tombol tambah tetap aman */
    .dt-search {
        display: none !important;
    }
</style>

<body>
    <div layout:fragment="content" th:fragment="content">
        <main class="main">
            <div class="container-fluid py-1">
                <!-- TABLE CARD -->
                <div class="card border-0 shadow-sm">
                    <!-- TOOLBAR -->
                    <div class="table-responsive ">
                        <table id="bankTable" class="table table-hover table-striped mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Kode</th>
                                    <th>Bank Account</th>
                                    <th>Saldo</th>
                                    <th>Coa</th>
                                    <th>Parent</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>

</html>
