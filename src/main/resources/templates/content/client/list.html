<!doctype html>
<html lang="id" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/main}">

<body>
  <div layout:fragment="content" th:fragment="content">
    <main class="main">
      <div class="container-fluid py-2">
        <div class="row g-3 mb-2">
          <!-- TOTAL -->
          <div class="col-12 col-sm-6 col-xl-3">
            <div class="card border-0 shadow-sm">
              <div class="card-body py-2 px-3 d-flex align-items-center">
                <div class="bg-primary bg-opacity-10 text-primary rounded p-2">
                  <i class="bi bi-people"></i>
                </div>
                <div class="ms-2">
                  <div class="text-muted small fw-semibold text-uppercase" style="letter-spacing: 0.3px;">Total Client
                  </div>
                  <div class="fw-semibold fs-5 text-primary" id="total-client">
                    <nb-skeleton variant="text" width="100%" height="24px"></nb-skeleton>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- AKTIF -->
          <div class="col-12 col-sm-6 col-xl-3">
            <div class="card border-0 shadow-sm">
              <div class="card-body py-2 px-3 d-flex align-items-center">
                <div class="bg-success bg-opacity-10 text-success rounded p-2">
                  <i class="bi bi-person-check"></i>
                </div>
                <div class="ms-2">
                  <div class="text-muted small fw-semibold text-uppercase" style="letter-spacing: 0.3px;">Client Aktif
                  </div>
                  <div class="fw-semibold fs-5 text-success" id="client-aktif">
                    <nb-skeleton variant="text" width="100%" height="24px"></nb-skeleton>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- NONAKTIF -->
          <div class="col-12 col-sm-6 col-xl-3">
            <div class="card border-0 shadow-sm">
              <div class="card-body py-2 px-3 d-flex align-items-center">
                <div class="bg-danger bg-opacity-10 text-danger rounded p-2">
                  <i class="bi bi-person-x"></i>
                </div>
                <div class="ms-2">
                  <div class="text-muted small fw-semibold text-uppercase" style="letter-spacing: 0.3px;">Nonaktif</div>
                  <div class="fw-semibold fs-5 text-danger" id="client-nonaktif">
                    <nb-skeleton variant="text" width="100%" height="24px"></nb-skeleton>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="col-12 col-sm-6 col-xl-3">
            <div class="card border-0 shadow-sm">
              <div class="card-body py-2 px-2 d-flex align-items-center">
                <div class="bg-warning bg-opacity-10 text-warning rounded p-2">
                  <i class="bi bi-person-plus"></i>
                </div>
                <div class="ms-2">
                  <div class="text-muted small fw-semibold text-uppercase" style="letter-spacing: 0.3px;">Client Baru
                  </div>
                  <div class="fw-semibold fs-5 text-warning" id="client-baru">
                    <nb-skeleton variant="text" width="100%" height="24px"></nb-skeleton>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>


        <div class="card border-0 shadow-sm">
          <div class="table-responsive">
            <table id="clientTable" class="table table-hover table-striped mb-0">
              <thead>
                <tr>
                  <th>Kode</th>
                  <th>Nama</th>
                  <th>Kontak</th>
                  <th>Telp</th>
                  <th>Email</th>
                  <th>Status</th>
                  <th>Aksi</th>
                </tr>
              </thead>

              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
    <script th:inline="javascript">
      var table = new DataTable("#clientTable", {
        ordering: false,
        processing: true,
        serverSide: true,
        columnDefs: [
          { targets: 0, width: '50px' },   // Kode
          { targets: 1, width: '200px' },  // Nama
          { targets: 2, width: '120px' },  // Kontak
          {
            targets: 3, width: '120px', type: 'string',
            className: 'text-start',
            orderable: false
          }, // telp
          { targets: 4, width: '150px' },  // email
          { targets: 5, width: '100px' },  // status
          { targets: 6, width: '60px' },  // aksi
        ],
        layout: {
          topStart: {
            pageLength: true,
          },
          topEnd: {
            search: true,
          },
        },

        language: {
          search: "",
          searchPlaceholder: "Cari nama...",
          lengthMenu: "_MENU_ Data Perhalaman",
          info: "Menampilkan _START_–_END_ dari _TOTAL_ data",
          infoEmpty: "Tidak ada data",
          zeroRecords: "Data tidak ditemukan",
          emptyTable: "Belum ada data",
          paginate: {
            first: "«",
            last: "»",
            next: "›",
            previous: "‹",
          },
        },

        ajax: async function (data, callback) {
          console.log("DATATABLES DATA:", data);
          const keyword = data.search?.value?.trim() || "";
          const params = new URLSearchParams({
            draw: data.draw,
            start: data.start,
            length: data.length,
            keyword: data.search?.value?.trim() || "",
          });

          console.log("KEYWORD JS =", keyword);
          try {
            const response = await fetch(`/api/v1/clients?${params}`, {
              credentials: "include",
            });
            console.log("RESPONSE:", response);
            const result = await response.json();

            callback({
              draw: data.draw,
              recordsTotal: result.recordsTotal,
              recordsFiltered: result.recordsFiltered,
              data: result.data,
            });
          } catch (error) {
            console.error("Gagal mengambil data:", error);

            callback({
              draw: data.draw,
              recordsTotal: 0,
              recordsFiltered: 0,
              data: [],
            });
          }
        },

        pageLength: 10,
        lengthMenu: [
          [10, 25, 50, 100],
          [10, 25, 50, 100]
        ],
        columns: [
          { data: "clientCode" },
          { data: "clientName" },
          { data: "clientContactPerson" },
          { data: "clientContactPhone" },
          { data: "clientEmail" },
          {
            data: "clientIsActive",
            render: function (data) {
              return data
                ? '<span class="badge bg-success">Aktif</span>'
                : '<span class="badge bg-secondary">Tidak Aktif</span>';
            },
          },
          {
            data: null,
            orderable: false,
            searchable: false,
            render: function (data, type, row) {
              return ` 
                <a href="/client/detail/${row.clientId}"
                  hx-get="/client/detail/${row.clientId}"
                  hx-target="#page-content"
                  hx-push-url="true"
                  hx-indicator="#loading"
                  class="btn btn-outline-secondary btn-sm action-btn"
                  title="Lihat Detail"
                  style="text-decoration:none">
                    <i class="bi bi-eye"></i>
                </a>`;
            },
          },
        ],
      });

      var searchBox = document.querySelector(
        "#clientTable_wrapper .dt-search",
      );

      if (searchBox && !searchBox.querySelector(".btn-add")) {
        searchBox.insertAdjacentHTML(
          "beforeend",
          `
        <a href="/client/new"
            class="btn btn-primary btn-sm ms-2 d-inline-flex align-items-center justify-content-center btn-add"
            hx-get="/client/new"
            hx-target="#page-content" hx-push-url="true" hx-indicator="#loading">
           <i class="bi bi-plus"></i>
        </a>`,
        );
      }

      table.on("draw", function () {
        htmx.process(document.querySelector("#clientTable tbody"));
      });

      async function total() {
        const url = "/api/v1/clients/total-new";

        try {
          const response = await fetch(url, {
            method: "GET",
            credentials: "include",
          });
          if (!response.ok) {
            throw new Error(`Response status: ${response.status}`);
          }
          const result = await response.json();
          document.getElementById("total-client").textContent = result.total;
          document.getElementById("client-aktif").textContent =
            result.totalActive;
          document.getElementById("client-nonaktif").textContent =
            result.totalInactive;
          document.getElementById("client-baru").textContent =
            result.totalNew;
        } catch (error) { }
      }

      total();
    </script>
  </div>
</body>

</html>
