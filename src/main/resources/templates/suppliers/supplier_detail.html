<div th:replace="~{fragments/head :: head('Detail Supplier/ Vendor')}"></div>

<body>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="main">
        <div th:replace="~{fragments/navbar :: navbar}"></div>
        <div class="detail-container">
            <div class="detail-header">
                <div class="detail-heading">
                    <div class="detail-title">
                        <h1 th:text="${supplier.supplierName}">
                        </h1>
                    </div>
                </div>
            </div>


            <!-- =========================================
     INFORMASI CLIENT
========================================= -->

            <div class="detail-card">
                <div class="card-heading">
                    <div class="card-heading-icon">👤</div>
                    <h2>
                        Informasi Supplier
                    </h2>
                </div>

                <div class="info-grid">
                    <div class="info-item">
                        <span class="info-label">
                            Kontak
                        </span>
                        <div class="info-value" th:text="${supplier.supplierContactPerson}"></div>
                    </div>

                    <div class="info-item">
                        <span class="info-label">
                            Email
                        </span>
                        <div class="info-value" th:text="${supplier.supplierEmail}"></div>
                    </div>

                    <div class="info-item">
                        <span class="info-label">
                            Telepon
                        </span>
                        <div class="info-value" th:text="${supplier.supplierContactPhone}"></div>
                    </div>

                    <div class="info-item">
                        <span class="info-label">
                            Dibuat
                        </span>
                        <div class="info-value"
                            th:text="${#temporals.format(supplier.supplierCreatedAt,'dd MMMM yyyy')}">
                        </div>
                    </div>

                    <div class="info-item">
                        <span class="info-label">
                            Alamat
                        </span>
                        <div class="info-value normal" th:text="${supplier.supplierAddress}">
                        </div>
                    </div>

                    <div class="info-item">
                        <span class="info-label">
                            Status
                        </span>

                        <div class="info-value normal">
                            <!-- Jika clientIsActive = true -->
                            <b> <span th:if="${supplier.supplierIsActive}" class="status-aktif">Aktif</span></b>
                            <!-- Jika clientIsActive = false -->
                            <b><span th:unless="${supplier.supplierIsActive}"
                                    class="status-tidak-aktif">Nonaktif</span></b>
                        </div>
                    </div>
                </div>

            </div>

            <div class="detail-card">
                <div class="card-heading">
                    <div class="card-heading-icon">
                        📄
                    </div>
                    <h2>
                        Informasi Pajak (Coretax)
                    </h2>
                </div>


                <div class="info-grid">
                    <div class="info-item">
                        <span class="info-label">
                            Tipe Identitas
                        </span>
                        <div class="info-value">
                            NPWP (PKP)
                        </div>
                    </div>

                    <div class="info-item">
                        <span class="info-label">
                            NPWP
                        </span>
                        <div class="info-value" th:text="${supplier.supplierNpwp}">
                        </div>
                    </div>


                    <!-- <div class="info-item">
                        <span class="info-label">
                            NITKU
                        </span>

                        <div class="info-value" th:text="${client.clientNitku}">
                        </div>
                    </div> -->


                    <!-- <div class="info-item">
                        <span class="info-label">
                            NIK
                        </span>
                        <div class="info-value" th:text="${client.clientNik}">
                        </div>
                    </div> -->
                </div>
            </div>

            <div class="three-column">
                <!-- BUSINESS -->
                <div class="small-card">
                    <div class="card-heading">
                        <div class="card-heading-icon">
                            💼
                        </div>
                        <h2>
                            Informasi Bisnis
                        </h2>
                    </div>


                    <div class="info-item">
                        <span class="info-label">
                            Kategori Supplier
                        </span>
                        <div class="info-value" th:text="${supplier.supplierType}">
                        </div>
                    </div>


                    <div class="info-item">
                        <span class="info-label">
                            Mata Uang
                        </span>
                        <div class="info-value">
                            IDR - Rupiah
                        </div>
                    </div>


                    <!-- <div class="info-item">
                        <span class="info-label">
                            Syarat Pembayaran
                        </span>
                        <div class="info-value">
                            30 Hari
                        </div>
                    </div> -->

                </div>


                <!-- BANK -->

                <div class="small-card">
                    <div class="card-heading">
                        <div class="card-heading-icon">
                            🏦
                        </div>
                        <h2>
                            Informasi Bank
                        </h2>
                    </div>


                    <div class="info-item">
                        <span class="info-label">
                            Nama Bank
                        </span>
                        <div class="info-value" th:text="${supplier.supplierBankName}">
                        </div>
                    </div>


                    <div class="info-item">
                        <span class="info-label">
                            No. Rekening
                        </span>
                        <div class="info-value" th:text="${supplier.supplierBankAccountNumber}">
                        </div>
                    </div>


                    <div class="info-item">
                        <span class="info-label">
                            Atas Nama
                        </span>
                        <div class="info-value" th:text="${supplier.supplierBankAccountName}">
                        </div>
                    </div>

                </div>


                <!-- NOTE -->

                <!-- <div class="small-card">
                    <div class="card-heading">
                        <div class="card-heading-icon">
                            📝
                        </div>
                        <h2>
                            Catatan
                        </h2>
                    </div>


                    <div class="info-item">
                        <div class="info-value normal">
                            -
                        </div>
                    </div>
                </div> -->
            </div>


            <!-- =========================================
     RIWAYAT AKTIVITAS
========================================= -->

            <!-- <div class="detail-card">
                <div class="card-heading">
                    <div class="card-heading-icon">
                        ◷
                    </div>
                    <h2>
                        Riwayat Aktivitas
                    </h2>
                </div>

                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Tanggal</th>
                                <th>Aktivitas</th>
                                <th>Oleh</th>
                                <th>Keterangan</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>
                                    01 Jun 2026 15:10
                                </td>
                                <td>
                                    Client dibuat
                                </td>
                                <td>
                                    Administrator
                                </td>
                                <td>
                                    Data client pertama kali dibuat
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div> -->


            <!-- =========================================
     BUTTON DI BAWAH
========================================= -->

            <div class="detail-actions">
                <a th:href="@{/supplier}" class="btn btn-light"> <i class="bi bi-arrow-left"></i> Kembali ke Daftar
                </a>
                <!-- ${client.clientName} -->
                <a th:href="@{/supplier/edit/{id}(id=${supplier.supplierId})}" class="btn btn-warning"><i
                        class="bi bi-pencil-square"></i> Edit
                </a>
                <button type="button" class="btn btn-danger">
                    <i class="bi bi-eye-slash"></i> Nonaktifkan
                </button>
            </div>
        </div>
    </main>
    <div th:replace="~{fragments/footer :: footer}">
    </div>
    <script th:src="@{/js/utility/dashboard.js}"></script>
</body>

</html>
