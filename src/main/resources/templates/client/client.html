<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{fragments/head :: head('Daftar Client')}"></div>

<body>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="main">
        <div th:replace="~{fragments/navbar :: navbar}"></div>
        <div class="container-fluid py-1">
            <div class="card border-0 shadow-sm">

                <!-- TOOLBAR -->
                <div class="card-body border-bottom">
                    <div class="row g-3 align-items-center">
                        <!-- SEARCH -->
                        <div class="col-12 col-md-12">
                            <div class="d-flex gap-2 align-items-center flex-wrap">
                                <div class="input-group" style="flex: 1; min-width: 200px;">
                                    <input type="search" id="searchClient" class="form-control"
                                        placeholder="search nama...">
                                </div>
                                <a th:href="@{/client/new}" class="btn btn-primary" style="white-space: nowrap;">
                                    <i class="bi bi-plus-lg"></i> Client baru
                                </a>
                                <button type="button" id="btn-refresh" class="btn btn-success"
                                    style="white-space: nowrap;">
                                    <i class="bi bi-arrow-clockwise"></i> Refresh
                                </button>
                            </div>
                        </div>
                    </div>
                </div>


                <!-- TABLE -->
                <div class="table-responsive table-wrapper-client" id="client-wrapper">
                    <table class="table table-hover align-middle mb-0" id="client">
                        <thead class="table-light">
                            <tr>
                                <th class="kolom-sticky-1 resizer">KODE</th>
                                <th class="kolom-sticky-3 resizer">NAMA</th>
                                <th class="resizer" style="width: 150px">KONTAK</th>
                                <th class="resizer" style="width: 150px">EMAIL</th>
                                <th class="resizer" style="width: 100px">STATUS</th>
                                <th class="resizer" style="width: 100px">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="client-table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}">
    </div>
    <script th:src="@{/js/utility/dashboard.js}"></script>
    <script type="module" th:inline="javascript">
        import { library } from '/js/utility/library.js';
        const clientModel = {
            cursorCreatedAt: null,
            cursorId: null,
            hasNext: true,
            loading: false,
            limit: 13,
            resizableInit: false,
            allData: [],

            setTableHeight: function (id_wrapper, id_table) {
                return library.setTableHeight(id_wrapper, id_table);
            },

            init: function () {
                const self = this;
                const wrapperId = document.getElementById("client-wrapper");
                this.findById("", true);
                this.initScroll(wrapperId); // 🔥 pasang di sini
                this.refResh()

                const searchInput = document.getElementById('searchClient');
                if (searchInput) {
                    searchInput.addEventListener('input', function (e) {
                        const keyword = e.target.value;
                        console.log("Kata Kunci", keyword)
                        self.findById(keyword, true);
                    });

                    // Clear search dengan tombol ESC
                    searchInput.addEventListener('keydown', function (e) {
                        const key = e.key;
                        // ✅ Deteksi ESC, Backspace, atau Delete
                        if (key === 'Escape' || key === 'Backspace' || key === 'Delete') {
                            e.target.value = '';
                            self.findById('', true);
                            e.target.blur();
                        }
                    });
                }
            },

            refResh: function () {
                const btnRefresh = document.getElementById("btn-refresh");
                btnRefresh.onclick = () => {
                    this.findById("", true);
                }
            },

            initScroll: function (wrapper) {
                if (this.scrollInitialized) return;
                this.scrollInitialized = true;
                let lastScrollTop = 0;
                wrapper.addEventListener("scroll", () => {
                    const scrollTop = wrapper.scrollTop;
                    const isScrollingDown = scrollTop > lastScrollTop;
                    lastScrollTop = scrollTop;
                    const nearBottom =
                        scrollTop + wrapper.clientHeight >= wrapper.scrollHeight - 70;
                    if (isScrollingDown && nearBottom && !this.loading && this.hasNext) {
                        console.log("LOAD NEXT PAGE");
                        this.findById("", false);
                    }
                });
            },

            findById: async function (keyword = "", reset = false) {
                if (this.loading) return;
                if (!this.hasNext && !reset) return;
                const tbody = document.getElementById("client-table-body");
                const statusMsg = "";

                if (reset) {
                    this.cursorCreatedAt = null;
                    this.cursorId = null;
                    this.hasNext = true;
                    tbody.innerHTML = "";
                }

                this.loading = true;
                UI.showSkeleton("client-table-body", 10);

                try {
                    const params = new URLSearchParams({
                        keyword: keyword,
                        limit: this.limit,
                    });

                    if (this.cursorCreatedAt && this.cursorId) {
                        params.append("lastCreatedAt", this.cursorCreatedAt);
                        params.append("lastId", this.cursorId);
                    }

                    const [json] = await Promise.all([
                        api.get(`/api/v1/clients?${params.toString()}`),
                        new Promise((resolve) => setTimeout(resolve, 1000)),
                    ]);

                    if (json && json.status === "success") {
                        const res = json.data;
                        UI.hideSkeleton();

                        const newBatch = res.data;
                        // 🔥 GABUNGKAN DATA: Jika reset, buat baru. Jika scroll, tambah ke belakang.
                        if (reset) {
                            this.allData = newBatch;
                        } else {
                            this.allData = [...(this.allData || []), ...newBatch];
                        }

                        // Kirim 'this.allData.length' untuk tahu posisi index awal batch ini
                        const startIndex = reset
                            ? 0
                            : this.allData.length - newBatch.length;
                        this.renderTable(newBatch, reset, startIndex);

                        // Update metadata paging dari res

                        console.log("res ", res);
                        // console.log("new Batch ", newBatch)

                        this.cursorCreatedAt = res.nextCreatedAt;
                        this.cursorId = res.nextId;
                        this.hasNext = res.hasNext;

                        console.log(" cursorId =", this.cursorId);
                        console.log(" hasNext =", this.hasNext);
                    }

                    this.setTableHeight("client-wrapper", "client")
                } catch (err) {
                    tbody.innerHTML = `<tr><td colspan="13" class="text-center text-danger">Error: ${err.message}</td></tr>`;
                    UI.hideSkeleton();
                } finally {
                    this.loading = false;
                    UI.hideSkeleton();
                }
            },

            renderTable: function (data, isReset = false, startIndex = 0) {
                const tbody = document.getElementById("client-table-body");

                if (!data || data.length === 0) {
                    if (isReset) {
                        tbody.innerHTML =
                            '<tr><td colspan="13" class="text-center py-3">No data available</td></tr>';
                    }
                    return;
                }

                if (isReset) {
                    tbody.innerHTML = "";
                }

                let rowsHtml = "";
                data.forEach((row, i) => {
                    var pkp = row.clientIsPkp;
                    var status = row.clientIsActive;
                    const globalIndex = startIndex + i;
                    rowsHtml += `
                    <tr class="clickable-row-client" data-index="${globalIndex}" id="row-client-${row.clientId}">
                        <td>${row.clientCode}</td>
                        <td>${row.clientName}</td>
                        <td>${row.clientContactPhone || "-"}</td>
                        <td>${row.clientEmail || "-"}</td>
                        <td class="text-center">
                        ${status === true
                            ? '<span class="status-aktif">Aktif</span>'
                            : '<span class="status-tidak-aktif">Nonaktif</span>'
                        }
                        </td>
                        <td>
                            <a href="/client/detail/${row.clientId}" style="text-decoration:none">Detail</a>
                        </td>
                       
                   </tr > `;
                });

                tbody.insertAdjacentHTML("beforeend", rowsHtml);
            },
        };
        window.clientModel = clientModel;
        clientModel.init();

    </script>
</body>

</html>
