<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <title>Register - KawalLaba ERP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --bg-body: #f8fafc;
      --text-dark: #0f172a;
      --text-muted: #64748b;
    }

    body {
        font-family: "Roboto", sans-serif;
      background-color: var(--bg-body);
      background-image:
        radial-gradient(at 0% 0%,
          rgba(37, 99, 235, 0.05) 0px,
          transparent 50%),
        radial-gradient(at 100% 100%,
          rgba(37, 99, 235, 0.05) 0px,
          transparent 50%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .card-register {
      width: 100%;
      max-width: 850px;
      background: #ffffff;
      padding: 50px;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(226, 232, 240, 0.8);
    }

    .logo-brand {
      font-weight: 800;
      font-size: 32px;
      color: var(--primary);
      letter-spacing: -0.5px;
      margin-bottom: 5px;
    }

    .title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-dark);
      letter-spacing: -0.02em;
    }

    /* Section Styling */
    .section-header {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
      margin-top: 30px;
    }

    .section-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0;
      white-space: nowrap;
    }

    .section-line {
      height: 1px;
      background: #e2e8f0;
      width: 100%;
      margin-left: 15px;
    }

    /* Form Controls */
    .form-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 8px;
    }

    .form-control,
    .form-select {
      border-radius: 12px;
      border: 1.5px solid #e2e8f0;
      background: #fbfcfd;
      padding: 12px 16px;
      font-size: 14px;
      transition: all 0.2s ease;
    }

    .form-control:focus,
    .form-select:focus {
      background: #fff;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
      transform: translateY(-1px);
    }

    /* Button */
    .btn-primary {
      border-radius: 12px;
      padding: 14px;
      background: var(--primary);
      border: none;
      font-weight: 600;
      font-size: 16px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
      transition: all 0.3s ease;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
    }

    .toggle-password {
      position: absolute;
      right: 15px;
      top: 42px;
      /* Disesuaikan dengan padding input */
      cursor: pointer;
      color: var(--text-muted);
      font-size: 18px;
      z-index: 10;
    }

    .text-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    .text-link:hover {
      text-decoration: underline;
    }

    .is-invalid {
      border-color: #ef4444 !important;
    }
  </style>
</head>

<body>
  <div class="card-register">
    <div class="text-center mb-5">
      <h1 class="logo-brand">Kawal-Laba</h1>
      <h2 class="title">Daftar Akun Baru</h2>
      <p class="text-muted small">
        Lengkapi data untuk memulai manajemen sumber daya perusahaan
      </p>
    </div>

    <form id="registerForm">
      <div class="row g-4">
        <div class="col-12">
          <div class="section-header">
            <span class="section-title">Data Perusahaan</span>
            <div class="section-line"></div>
          </div>
        </div>

        <div class="col-12">
          <label class="form-label">Nama Resmi Perusahaan</label>
          <input type="text" id="legalName" name="legalName" class="form-control"
            placeholder="Contoh: PT Maju Jaya Abadi" />
          <small class="text-danger" id="err-legalName"></small>
        </div>

        <div class="col-12">
          <label class="form-label">Alamat Lengkap Kantor</label>
          <textarea id="address" name="address" class="form-control" rows="2"
            placeholder="Jl. Gatot Subroto No.161..."></textarea>
          <small class="text-danger" id="err-address"></small>
        </div>

        <div class="col-md-4">
          <label class="form-label">Kota</label>
          <input type="text" id="city" name="city" class="form-control" placeholder="Bandar Lampung" />
          <small class="text-danger" id="err-city"></small>
        </div>

        <div class="col-md-4">
          <label class="form-label">Provinsi</label>
          <input type="text" id="province" name="province" class="form-control" placeholder="Lampung" />
          <small class="text-danger" id="err-province"></small>
        </div>

        <div class="col-md-4">
          <label class="form-label">Kode Pos</label>
          <input type="text" id="postalCode" name="postalCode" class="form-control" placeholder="35228" />
          <small class="text-danger" id="err-postalCode"></small>
        </div>

        <div class="col-md-6">
          <label class="form-label">Email Perusahaan</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="admin@perusahaan.com" />
          <small class="text-danger" id="err-email"></small>
        </div>

        <div class="col-md-6">
          <label class="form-label">No. Telepon / WhatsApp</label>
          <input type="text" id="phone" name="phone" class="form-control" placeholder="08123456789" />
          <small class="text-danger" id="err-phone"></small>
        </div>

        <div class="col-md-6">
          <label class="form-label">Jenis Bisnis</label>
          <select id="companyType" name="companyType" class="form-select">
            <option value="">Pilih Jenis</option>
            <option>PT</option>
            <option>CV</option>
            <option>UMKM</option>
          </select>
          <small class="text-danger" id="err-companyType"></small>
        </div>

        <div class="col-md-6">
          <label class="form-label">Mata Uang Utama</label>
          <select id="baseCurrency" name="baseCurrency" class="form-select">
            <option value="IDR">IDR - Indonesian Rupiah</option>
          </select>
          <small class="text-danger" id="err-baseCurrency"></small>
        </div>

        <div class="col-12">
          <div class="section-header">
            <span class="section-title">Kredensial </span>
            <div class="section-line"></div>
          </div>
        </div>

        <div class="col-md-6">
          <label class="form-label">Username </label>
          <input type="text" id="userName" name="userName" class="form-control" placeholder="Username untuk login" />
          <small class="text-danger" id="err-userName"></small>
        </div>

        <div class="col-md-6 position-relative">
          <label class="form-label">Password</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Min. 6 karakter" />
          <i class="bi bi-eye toggle-password" id="eyeIcon" onclick="togglePassword()"></i>
          <small class="text-danger" id="err-password"></small>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 mt-5">
        Buat Akun
      </button>
    </form>

    <div class="text-center mt-4">
      <p class="text-muted small">
        Sudah memiliki akses?
        <a th:href="@{/login}" class="text-link">Masuk Sekarang</a>
      </p>
    </div>
  </div>

  <script>
    document
      .getElementById("registerForm")
      .addEventListener("submit", async function (e) {
        e.preventDefault();
        const formData = new FormData(this);
        const data = Object.fromEntries(formData.entries());

        // Loading state
        Swal.fire({
          title: "Sedang Memproses...",
          allowOutsideClick: false,
          didOpen: () => {
            Swal.showLoading();
          },
        });

        try {
          const res = await fetch("/api/company", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data),
          });

          if (!res.ok) {
            const err = await res.json();
            showErrors(err.errors, this);
            Swal.close();
            return;
          }

          Swal.fire({
            title: "Pendaftaran Berhasil!",
            text: "Sistem Anda sedang disiapkan. Silakan login.",
            icon: "success",
            confirmButtonColor: "#2563eb",
          }).then(() => {
            window.location.href = "/login";
          });
        } catch (error) {
          Swal.fire("Error", "Gagal menghubungi server", "error");
        }
      });

    function showErrors(errors, formEl) {
      formEl
        .querySelectorAll(".is-invalid")
        .forEach((i) => i.classList.remove("is-invalid"));
      formEl
        .querySelectorAll('[id^="err-"]')
        .forEach((e) => (e.innerText = ""));

      for (const field in errors) {
        const input = formEl.querySelector(`[name="${field}"]`);
        const errorEl = formEl.querySelector("#err-" + field);
        if (input) input.classList.add("is-invalid");
        if (errorEl) errorEl.innerText = errors[field];
      }
    }

    function togglePassword() {
      const input = document.getElementById("password");
      const icon = document.getElementById("eyeIcon");
      if (input.type === "password") {
        input.type = "text";
        icon.classList.replace("bi-eye", "bi-eye-slash");
      } else {
        input.type = "password";
        icon.classList.replace("bi-eye-slash", "bi-eye");
      }
    }
  </script>
</body>

</html>
